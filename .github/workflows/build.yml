# Build witchbox1 on a GitHub runner: the tests, then the firmware package on fm1-base and the site (the web
# installer, the manual, the backup page). It needs JieLi's package server and Gitee to be reachable from the runner.
name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - name: Tools
        run: |
          pip install Pillow
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libraqm0 valgrind
      - name: Tests (no hardware, no JieLi toolchain)
        run: tests/run_tests.sh
      - name: JieLi toolchain
        run: base/tools/get_toolchain.sh
      - name: JieLi AC79 SDK
        run: >-
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13
          https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
      - name: Build the firmware (a development build, for the update-path tests)
        run: ./build.sh
      - name: Tests again, with the package (the quick sweep; the full one ran above)
        run: QUICK=1 tests/run_tests.sh
      - name: Build the release
        run: ./build.sh --release 0.4
      - name: The browser emulator
        run: ./build.sh --web
      - name: The site (the web installer, with m-bootloader on offer; the manual; the emulator; the backup page)
        run: |
          python3 base/tools/make_site.py app app/build/witchbox1-0.4.fwsc 0.4 app/build/site
          python3 tools/site_skin.py app/build/site 0.4 witchbox1-0.4.fwsc
      - uses: actions/upload-artifact@v4
        with:
          name: witchbox1-firmware
          path: |
            app/build/witchbox1-0.4.fwsc
            app/build/site/
            app/build/witchbox1.dis
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: app/build/site
  pages:
    # the site at its permanent address (GitHub Pages, from the build above): the installer, the manual, the emulator
    if: github.ref == 'refs/heads/main'
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deploy
        uses: actions/deploy-pages@v4
